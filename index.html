<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kitty Explains 🐱</title>

<style>
:root{
  --bg1:#fdfcff;
  --bg2:#f3f4f8;
  --card:#ffffff;
  --ink:#111;
  --muted:#6b7280;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Arial;
  color:var(--ink);
  background:
    radial-gradient(900px 500px at 10% 0%, rgba(255,192,203,.25), transparent 60%),
    radial-gradient(900px 500px at 90% 0%, rgba(199,210,254,.25), transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  min-height:100vh;
}

/* top bar */
header{
  position:sticky;
  top:0;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(0,0,0,.06);
  z-index:10;
}

.bar{
  max-width:1100px;
  margin:0 auto;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  flex-direction:column;
  line-height:1.1;
}

.brand strong{
  font-size:16px;
  letter-spacing:.2px;
}

.brand span{
  font-size:12px;
  color:var(--muted);
}

.controls{
  display:flex;
  gap:10px;
  align-items:center;
}

.btn{
  border:1px solid rgba(0,0,0,.12);
  background:#fff;
  border-radius:999px;
  padding:10px 12px;
  font-weight:800;
  cursor:pointer;
  transition:.15s ease;
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.counter{
  font-weight:900;
  font-size:13px;
  color:#555;
}

/* stage */
main{
  max-width:1100px;
  margin:0 auto;
  padding:28px 16px 40px;
}

.stage{
  background:rgba(255,255,255,.7);
  border-radius:28px;
  padding:22px 18px 18px;
  box-shadow:
    0 30px 80px rgba(0,0,0,.10),
    inset 0 1px 0 rgba(255,255,255,.7);
  backdrop-filter:blur(10px);
}

/* ⭐ INSTAGRAM CARD FEEL */
.viewport{
  width:100%;
  max-width:420px;
  margin:0 auto;
  aspect-ratio:9/16;
  position:relative;
  border-radius:24px;
  overflow:hidden;
  background:#fff;
  border:1px solid rgba(0,0,0,.06);
  box-shadow:
    0 25px 60px rgba(0,0,0,.15),
    0 8px 20px rgba(0,0,0,.08);
}

.slide{
  position:absolute;
  inset:0;
  opacity:0;
  transform:scale(.985) translateY(6px);
  transition:
    opacity .25s ease,
    transform .25s ease;
  display:flex;
  align-items:center;
  justify-content:center;
}

.slide.active{
  opacity:1;
  transform:scale(1) translateY(0);
  z-index:2;
}

.slide img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#fff;
}

/* dots */
.dots{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:16px 12px 6px;
  flex-wrap:wrap;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  border:1px solid rgba(0,0,0,.25);
  background:#fff;
  cursor:pointer;
  transition:.15s ease;
}

.dot:hover{
  transform:scale(1.15);
}

.dot.active{
  background:#111;
  border-color:#111;
}

.hint{
  text-align:center;
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}
</style>
</head>

<body>

<header>
  <div class="bar">
    <div class="brand">
      <strong>Kitty Explains 🐱</strong>
      <span>swipe · arrows · dots</span>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn">←</button>
      <div class="counter" id="counter">1 / 10</div>
      <button class="btn" id="nextBtn">→</button>
    </div>
  </div>
</header>

<main>
  <div class="stage">
    <div class="viewport" id="viewport"></div>
    <div class="dots" id="dots"></div>
    <div class="hint">← → oder wischen</div>
  </div>
</main>

<script>
// ⭐ jetzt 10 slides
const TOTAL_SLIDES = 10;

const slides = Array.from({length:TOTAL_SLIDES}, (_,i)=>({
  id:i+1,
  src:`assets/${i+1}.png`
}));

const viewport = document.getElementById("viewport");
const dots = document.getElementById("dots");
const counter = document.getElementById("counter");

let current = 0;

function placeholder(id){
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600">
      <rect width="100%" height="100%" fill="#ffffff"/>
      <text x="50%" y="50%" text-anchor="middle"
        font-family="Arial" font-size="36" fill="#999">
        Missing: assets/${id}.png
      </text>
    </svg>
  `);
}

function render(){
  viewport.innerHTML="";
  dots.innerHTML="";

  slides.forEach((s,i)=>{
    const slide=document.createElement("div");
    slide.className="slide"+(i===current?" active":"");

    const img=document.createElement("img");
    img.src=s.src;
    img.alt=`Slide ${s.id}`;
    img.onerror=()=>img.src=placeholder(s.id);

    slide.appendChild(img);
    viewport.appendChild(slide);

    const dot=document.createElement("button");
    dot.className="dot"+(i===current?" active":"");
    dot.onclick=()=>go(i);
    dots.appendChild(dot);
  });

  counter.textContent=`${current+1} / ${slides.length}`;
}

function go(i){
  current=(i+slides.length)%slides.length;
  render();
}

document.getElementById("nextBtn").onclick=()=>go(current+1);
document.getElementById("prevBtn").onclick=()=>go(current-1);

// keyboard
window.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") go(current+1);
  if(e.key==="ArrowLeft") go(current-1);
});

// swipe
let startX=null;
viewport.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
},{passive:true});

viewport.addEventListener("touchend",e=>{
  if(startX==null) return;
  const dx=e.changedTouches[0].clientX-startX;
  if(Math.abs(dx)>40){
    dx<0?go(current+1):go(current-1);
  }
  startX=null;
});

render();
</script>

</body>
</html>
