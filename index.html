<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kitty Explains 🐱</title>

  <style>
    :root{
      --bg1:#fbfbfd;
      --bg2:#f4f4f7;
      --card:#ffffff;
      --ink:#121316;
      --muted:#6b7280;
      --border:rgba(0,0,0,.08);
      --shadow: 0 18px 60px rgba(0,0,0,.10);
      --shadow2: 0 10px 26px rgba(0,0,0,.08);
      --radius: 22px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--ink);
      background:
        radial-gradient(900px 500px at 20% 10%, rgba(255, 192, 203, .25), transparent 60%),
        radial-gradient(900px 500px at 80% 0%, rgba(199, 210, 254, .35), transparent 60%),
        radial-gradient(900px 500px at 60% 90%, rgba(209, 250, 229, .30), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height:100vh;
    }

    /* Top bar */
    header{
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,.06);
    }
    .bar{
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 0;
    }
    .logo{
      width:36px;height:36px;border-radius:12px;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,192,203,.95), rgba(199,210,254,.7) 45%, rgba(209,250,229,.8) 85%);
      box-shadow: 0 10px 26px rgba(0,0,0,.08);
      border: 1px solid rgba(255,255,255,.6);
    }
    .titleWrap{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }
    .titleWrap strong{
      font-size:15px;
      letter-spacing:.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .titleWrap span{
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .controls{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .btn{
      border: 1px solid var(--border);
      background: rgba(255,255,255,.92);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(0,0,0,.03);
      transition: transform .08s ease, box-shadow .2s ease, background .2s ease;
    }
    .btn:hover{
      background:#fff;
      box-shadow: var(--shadow2);
    }
    .btn:active{ transform: translateY(1px); }

    .pill{
      border: 1px solid var(--border);
      background: rgba(255,255,255,.75);
      border-radius: 999px;
      padding: 10px 12px;
      font-weight: 900;
      font-size: 12px;
      color: var(--muted);
      box-shadow: 0 1px 0 rgba(0,0,0,.03);
    }

    main{
      max-width:1120px;
      margin: 0 auto;
      padding: 20px 16px 36px;
      display:grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    /* Card stage */
    .stage{
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }

    /* Subtle top gradient inside card */
    .stage::before{
      content:"";
      position:absolute;
      inset:-1px;
      background:
        radial-gradient(800px 380px at 10% 0%, rgba(255,192,203,.25), transparent 60%),
        radial-gradient(800px 380px at 90% 0%, rgba(199,210,254,.28), transparent 60%);
      pointer-events:none;
      opacity:.7;
    }

    .stageInner{
      position:relative;
      padding: 16px 16px 14px;
      display:grid;
      gap: 14px;
    }

    /* ✅ Perfect size you liked */
    .viewport{
      width:100%;
      max-width:420px;
      margin: 6px auto 0;
      aspect-ratio: 9 / 16;
      position:relative;
      border-radius: 18px;
      overflow:hidden;
      background:#fff;
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 18px 50px rgba(0,0,0,.10);
      touch-action: pan-y;
    }

    .slide{
      position:absolute;
      inset:0;
      opacity:0;
      transform: translateY(8px);
      transition: opacity .22s ease, transform .22s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
    }
    .slide.active{
      opacity:1;
      transform: translateY(0);
      z-index:2;
    }
    .slide img{
      width:100%;
      height:100%;
      object-fit: contain;
      background:#fff;
      display:block;
    }

    .bottomRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      padding: 0 4px;
    }

    .hint{
      font-size:12px;
      color: var(--muted);
      font-weight:700;
    }

    /* Dots */
    .dots{
      display:flex;
      justify-content:center;
      gap:10px;
      padding: 10px 12px 14px;
      border-top: 1px solid rgba(0,0,0,.06);
      background: rgba(255,255,255,.55);
      flex-wrap:wrap;
    }
    .dot{
      width:10px; height:10px;
      border-radius:999px;
      border: 1px solid rgba(0,0,0,.22);
      background: rgba(255,255,255,.9);
      cursor:pointer;
      padding:0;
      transition: transform .12s ease, background .2s ease;
    }
    .dot:hover{ transform: scale(1.1); }
    .dot.active{
      background: var(--ink);
      border-color: var(--ink);
    }

    footer{
      max-width:1120px;
      margin: 0 auto;
      padding: 0 16px 26px;
      color: var(--muted);
      font-size:12px;
      font-weight:700;
      text-align:center;
    }
    code{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
      background: rgba(255,255,255,.7);
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,.06);
    }

    @media (min-width: 860px){
      main{ padding-top: 26px; }
    }
  </style>
</head>

<body>
<header>
  <div class="bar">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div class="titleWrap">
        <strong>Kitty Explains</strong>
        <span>Swipe · Pfeile · Dots · GitHub Pages ready</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn" aria-label="Vorherige Slide">←</button>
      <span class="pill" id="counter">1 / 9</span>
      <button class="btn" id="nextBtn" aria-label="Nächste Slide">→</button>
    </div>
  </div>
</header>

<main>
  <section class="stage" id="stage">
    <div class="stageInner">
      <div class="viewport" id="viewport" aria-label="Slides"></div>

      <div class="bottomRow">
        <div class="hint">
          Assets: <code>/assets/1.png</code> … <code>/assets/9.png</code>
        </div>
        <div class="hint">
          Tipp: <strong>←/→</strong> oder wischen
        </div>
      </div>
    </div>

    <div class="dots" id="dots" aria-label="Slide navigation"></div>
  </section>
</main>

<footer>
  made for tiny wholesome internet vibes 🩷
</footer>

<script>
  // Auto-load assets/1.png … 9.png
  const slides = Array.from({length:9}, (_,i)=>({
    id:i+1,
    src:`assets/${i+1}.png`
  }));

  const viewport = document.getElementById("viewport");
  const dots = document.getElementById("dots");
  const counter = document.getElementById("counter");

  let current = 0;

  function placeholderDataUri(id){
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600">
        <rect width="100%" height="100%" fill="#ffffff"/>
        <text x="50%" y="50%" text-anchor="middle"
          font-family="Arial" font-size="36" font-weight="700" fill="#999">
          Missing: assets/${id}.png
        </text>
      </svg>
    `);
  }

  function render(){
    viewport.innerHTML = "";
    dots.innerHTML = "";

    slides.forEach((s, i) => {
      const slide = document.createElement("div");
      slide.className = "slide" + (i === current ? " active" : "");

      const img = document.createElement("img");
      img.src = s.src;
      img.alt = `Slide ${s.id}`;
      img.onerror = () => { img.src = placeholderDataUri(s.id); };

      slide.appendChild(img);
      viewport.appendChild(slide);

      const dot = document.createElement("button");
      dot.className = "dot" + (i === current ? " active" : "");
      dot.type = "button";
      dot.ariaLabel = `Go to slide ${i+1}`;
      dot.addEventListener("click", () => go(i));
      dots.appendChild(dot);
    });

    counter.textContent = `${current + 1} / ${slides.length}`;
  }

  function go(i){
    current = (i + slides.length) % slides.length;
    render();
  }

  // Buttons
  document.getElementById("prevBtn").addEventListener("click", () => go(current - 1));
  document.getElementById("nextBtn").addEventListener("click", () => go(current + 1));

  // Keyboard
  window.addEventListener("keydown", (e) => {
    if(e.key === "ArrowRight") go(current + 1);
    if(e.key === "ArrowLeft") go(current - 1);
  });

  // Swipe
  let startX = null;
  viewport.addEventListener("touchstart", (e) => {
    if(!e.touches || e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
  }, {passive:true});

  viewport.addEventListener("touchend", (e) => {
    if(startX == null) return;
    const endX = e.changedTouches[0].clientX;
    const dx = endX - startX;
    startX = null;
    if(Math.abs(dx) > 40){
      dx < 0 ? go(current + 1) : go(current - 1);
    }
  });

  render();
</script>
</body>
</html>
