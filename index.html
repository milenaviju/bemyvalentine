<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kitty Explains 🐱</title>

  <style>
    :root{
      --bg1:#fbfbfd;
      --bg2:#f4f4f7;
      --card:rgba(255,255,255,.70);
      --card2:rgba(255,255,255,.55);
      --ink:#121316;
      --muted:#6b7280;
      --border:rgba(0,0,0,.08);
      --shadow: 0 18px 60px rgba(0,0,0,.10);
      --shadow2: 0 12px 30px rgba(0,0,0,.10);
      --radius: 22px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--ink);
      background:
        radial-gradient(900px 500px at 15% 5%, rgba(255, 192, 203, .22), transparent 60%),
        radial-gradient(900px 500px at 85% 0%, rgba(199, 210, 254, .33), transparent 60%),
        radial-gradient(900px 500px at 55% 90%, rgba(209, 250, 229, .28), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height:100vh;
    }

    header{
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,.06);
    }
    .bar{
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 0;
    }
    .logo{
      width:36px;height:36px;border-radius:12px;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,192,203,.95), rgba(199,210,254,.7) 45%, rgba(209,250,229,.8) 85%);
      box-shadow: 0 10px 26px rgba(0,0,0,.08);
      border: 1px solid rgba(255,255,255,.6);
    }
    .titleWrap{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }
    .titleWrap strong{
      font-size:15px;
      letter-spacing:.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .titleWrap span{
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .controls{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .btn{
      border: 1px solid var(--border);
      background: rgba(255,255,255,.92);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 12px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(0,0,0,.03);
      transition: transform .08s ease, box-shadow .2s ease, background .2s ease;
    }
    .btn:hover{ background:#fff; box-shadow: var(--shadow2); }
    .btn:active{ transform: translateY(1px); }

    .pill{
      border: 1px solid var(--border);
      background: rgba(255,255,255,.75);
      border-radius: 999px;
      padding: 10px 12px;
      font-weight: 900;
      font-size: 12px;
      color: var(--muted);
      box-shadow: 0 1px 0 rgba(0,0,0,.03);
    }

    main{
      max-width:1120px;
      margin: 0 auto;
      padding: 20px 16px 36px;
      display:grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .stage{
      background: var(--card);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }
    .stage::before{
      content:"";
      position:absolute;
      inset:-1px;
      background:
        radial-gradient(800px 380px at 10% 0%, rgba(255,192,203,.22), transparent 60%),
        radial-gradient(800px 380px at 90% 0%, rgba(199,210,254,.26), transparent 60%);
      pointer-events:none;
      opacity:.85;
    }

    .stageInner{
      position:relative;
      padding: 16px 16px 14px;
      display:grid;
      gap: 14px;
    }

    /* Terminal-style top bar */
    .terminalBar{
      max-width: 420px;
      margin: 0 auto;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.08);
      background: rgba(255,255,255,.82);
      box-shadow: 0 10px 26px rgba(0,0,0,.08);
      overflow:hidden;
    }
    .terminalTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(0,0,0,.06);
      background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.75));
    }
    .traffic{
      display:flex; gap:7px; align-items:center;
    }
    .dotWin{ width:10px;height:10px;border-radius:999px; border:1px solid rgba(0,0,0,.10); }
    .d1{ background: rgba(255, 99, 99, .9); }
    .d2{ background: rgba(255, 201, 71, .95); }
    .d3{ background: rgba(87, 227, 137, .95); }

    .path{
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(0,0,0,.62);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      flex: 1;
      text-align:center;
    }
    .badge{
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
      color: rgba(0,0,0,.7);
      border: 1px solid rgba(0,0,0,.10);
      background: rgba(255,255,255,.85);
      padding: 5px 9px;
      border-radius: 999px;
      white-space:nowrap;
    }

    .terminalBottom{
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(0,0,0,.72);
      background: rgba(255,255,255,.65);
    }
    .terminalBottom .cmd{
      color: rgba(0,0,0,.82);
      font-weight: 800;
    }

    /* Reel viewport (size you liked) */
    .viewport{
      width:100%;
      max-width:420px;
      margin: 0 auto;
      aspect-ratio: 9 / 16;
      position:relative;
      border-radius: 18px;
      overflow:hidden;
      background:#fff;
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 18px 50px rgba(0,0,0,.10);
      touch-action: pan-y;
    }

    .slide{
      position:absolute;
      inset:0;
      opacity:0;
      transform: translateY(8px);
      transition: opacity .22s ease, transform .22s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
    }
    .slide.active{
      opacity:1;
      transform: translateY(0);
      z-index:2;
    }
    .slide img{
      width:100%;
      height:100%;
      object-fit: contain;
      background:#fff;
      display:block;
    }

    .bottomRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      padding: 0 4px;
      max-width: 420px;
      margin: 0 auto;
    }

    .hint{
      font-size:12px;
      color: var(--muted);
      font-weight:800;
    }
    .kbd{
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 900;
      color: rgba(0,0,0,.7);
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.75);
      padding: 3px 6px;
      border-radius: 8px;
      margin-left: 6px;
    }

    /* Dots */
    .dots{
      display:flex;
      justify-content:center;
      gap:10px;
      padding: 10px 12px 14px;
      border-top: 1px solid rgba(0,0,0,.06);
      background: var(--card2);
      flex-wrap:wrap;
    }
    .dotNav{
      width:10px; height:10px;
      border-radius:999px;
      border: 1px solid rgba(0,0,0,.22);
      background: rgba(255,255,255,.9);
      cursor:pointer;
      padding:0;
      transition: transform .12s ease, background .2s ease;
    }
    .dotNav:hover{ transform: scale(1.1); }
    .dotNav.active{
      background: var(--ink);
      border-color: var(--ink);
    }

    footer{
      max-width:1120px;
      margin: 0 auto;
      padding: 0 16px 26px;
      color: var(--muted);
      font-size:12px;
      font-weight:800;
      text-align:center;
    }
    code{
      font-family: var(--mono);
      font-size: 11px;
      background: rgba(255,255,255,.7);
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,.06);
    }

    /* Cute, subtle confetti overlay (hidden by default) */
    .confetti{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:0;
      transition: opacity .2s ease;
      background:
        radial-gradient(circle at 10% 20%, rgba(255,192,203,.35), transparent 22%),
        radial-gradient(circle at 70% 10%, rgba(199,210,254,.35), transparent 22%),
        radial-gradient(circle at 90% 60%, rgba(209,250,229,.35), transparent 22%),
        radial-gradient(circle at 30% 80%, rgba(254, 249, 195, .30), transparent 22%);
      mix-blend-mode: multiply;
    }
    .confetti.on{ opacity:1; }

    @media (max-width: 420px){
      .terminalBar, .viewport, .bottomRow{ max-width: 100%; }
      .path{ text-align:left; }
    }
  </style>
</head>

<body>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<header>
  <div class="bar">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div class="titleWrap">
        <strong>Kitty Explains</strong>
        <span>dev-mode UI · swipe / arrows · no autoplay</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn" aria-label="Vorherige Slide">←</button>
      <span class="pill" id="counter">1 / 9</span>
      <button class="btn" id="nextBtn" aria-label="Nächste Slide">→</button>
      <!-- Optional link: set your repo url below -->
      <a class="btn" id="ghBtn" href="#" target="_blank" rel="noreferrer" style="text-decoration:none; display:inline-flex; align-items:center; gap:8px;">
        <span style="font-family:var(--mono); font-weight:900;">{ }</span>
        GitHub
      </a>
    </div>
  </div>
</header>

<main>
  <section class="stage" id="stage">
    <div class="stageInner">

      <div class="terminalBar" aria-label="Dev header">
        <div class="terminalTop">
          <div class="traffic" aria-hidden="true">
            <span class="dotWin d1"></span>
            <span class="dotWin d2"></span>
            <span class="dotWin d3"></span>
          </div>
          <div class="path" id="path">~/kitty-explains · assets/1.png</div>
          <div class="badge" id="badge">build: pawsome ✅</div>
        </div>
        <div class="terminalBottom">
          <span class="cmd">$</span> <span id="cmdText">npm run show-kitties</span>
        </div>
      </div>

      <div class="viewport" id="viewport" aria-label="Slides"></div>

      <div class="bottomRow">
        <div class="hint">
          <span style="font-family:var(--mono); font-weight:900;">assets/1.png … 9.png</span>
        </div>
        <div class="hint">
          Next: <span class="kbd">→</span> Prev: <span class="kbd">←</span>
          <span class="kbd" title="Easter egg">↑↑↓↓←→←→BA</span>
        </div>
      </div>
    </div>

    <div class="dots" id="dots" aria-label="Slide navigation"></div>
  </section>
</main>

<footer>
  tiny wholesome internet vibes · hosted on GitHub Pages 🩷
</footer>

<script>
  // ---- CONFIG: set your repo URL (optional) ----
  // Example: "https://github.com/USERNAME/kitty-explains"
  const REPO_URL = ""; // <- put your repo url here if you want the GitHub button to work

  // Auto-load assets/1.png … 9.png
  const slides = Array.from({length:9}, (_,i)=>({
    id:i+1,
    src:`assets/${i+1}.png`
  }));

  const viewport = document.getElementById("viewport");
  const dots = document.getElementById("dots");
  const counter = document.getElementById("counter");
  const pathEl = document.getElementById("path");
  const cmdText = document.getElementById("cmdText");
  const ghBtn = document.getElementById("ghBtn");
  const confetti = document.getElementById("confetti");

  if(REPO_URL){
    ghBtn.href = REPO_URL;
  } else {
    ghBtn.style.display = "none";
  }

  let current = 0;

  const cmdVariants = [
    "npm run show-kitties",
    "git commit -m \"meow\"",
    "pnpm i && pnpm dev",
    "echo \"purr\" >> README.md",
    "git push origin main"
  ];

  function placeholderDataUri(id){
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600">
        <rect width="100%" height="100%" fill="#ffffff"/>
        <text x="50%" y="50%" text-anchor="middle"
          font-family="Arial" font-size="36" font-weight="700" fill="#999">
          Missing: assets/${id}.png
        </text>
      </svg>
    `);
  }

  function render(){
    viewport.innerHTML = "";
    dots.innerHTML = "";

    slides.forEach((s, i) => {
      const slide = document.createElement("div");
      slide.className = "slide" + (i === current ? " active" : "");

      const img = document.createElement("img");
      img.src = s.src;
      img.alt = `Slide ${s.id}`;
      img.onerror = () => { img.src = placeholderDataUri(s.id); };

      slide.appendChild(img);
      viewport.appendChild(slide);

      const dot = document.createElement("button");
      dot.className = "dotNav" + (i === current ? " active" : "");
      dot.type = "button";
      dot.ariaLabel = `Go to slide ${i+1}`;
      dot.addEventListener("click", () => go(i));
      dots.appendChild(dot);
    });

    counter.textContent = `${current + 1} / ${slides.length}`;
    pathEl.textContent = `~/kitty-explains · assets/${current+1}.png`;
    cmdText.textContent = cmdVariants[current % cmdVariants.length];
  }

  function go(i){
    current = (i + slides.length) % slides.length;
    render();
  }

  // Buttons
  document.getElementById("prevBtn").addEventListener("click", () => go(current - 1));
  document.getElementById("nextBtn").addEventListener("click", () => go(current + 1));

  // Keyboard nav
  window.addEventListener("keydown", (e) => {
    if(e.key === "ArrowRight") go(current + 1);
    if(e.key === "ArrowLeft") go(current - 1);
  });

  // Swipe
  let startX = null;
  viewport.addEventListener("touchstart", (e) => {
    if(!e.touches || e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
  }, {passive:true});

  viewport.addEventListener("touchend", (e) => {
    if(startX == null) return;
    const endX = e.changedTouches[0].clientX;
    const dx = endX - startX;
    startX = null;
    if(Math.abs(dx) > 40){
      dx < 0 ? go(current + 1) : go(current - 1);
    }
  });

  // --- Cute Easter egg: Konami code toggles confetti overlay ---
  const konami = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
  let k = 0;
  window.addEventListener("keydown", (e) => {
    const key = e.key;
    if(key === konami[k]){
      k++;
      if(k === konami.length){
        confetti.classList.toggle("on");
        k = 0;
      }
    } else {
      k = 0;
    }
  });

  render();
</script>
</body>
</html>
